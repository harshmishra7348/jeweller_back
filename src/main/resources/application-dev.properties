spring.application.name=tea
#spring.datasource.url=jdbc:mysql://localhost:3306/tea_database
spring.datasource.url=jdbc:mysql://localhost:3306/jewellery_database
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

#Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Product image / invoice attachment upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# JWT signing (override with a long random secret in production)
app.jwt.secret=change-me-to-a-long-random-secret-at-least-32-chars
app.jwt.expiration-ms=10800000

# Seller details printed on the PDF invoice
app.company.email=
app.invoice.payment-terms-days=7

